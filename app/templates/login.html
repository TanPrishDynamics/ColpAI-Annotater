{% extends "base.html" %}
{% block title %}Login - ColpAI{% endblock %}
{% block body %}
<main style="max-width: 400px; margin: 10vh auto 0; padding: 0 24px;">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-family: var(--font-heading); color: var(--accent); font-size: 26px; margin: 0 0 6px;">ColpAI Annotator</h1>
        <p class="muted" style="margin: 0;">Sign in with the username and password you were given.</p>
    </div>
    <div class="card">
        <div id="alert"></div>
        <form id="loginForm">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="loginBtn" style="width: 100%;">Sign in</button>
        </form>
    </div>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const alertBox = document.getElementById('alert');
    const btn = document.getElementById('loginBtn');
    alertBox.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
        const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password}),
            credentials: 'same-origin',
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = '/dashboard';
            return;
        }
        alertBox.innerHTML = `<div class="alert error">${data.error?.message || 'Login failed. Check your username and password.'}</div>`;
    } catch (err) {
        alertBox.innerHTML = `<div class="alert error">Could not reach the server. Check your connection and try again.</div>`;
    }
    btn.disabled = false;
    btn.textContent = 'Sign in';
});
</script>
{% endblock %}
